# dsh-session-search-pro bundle patch
#
# 一件事：停掉官方 @deepseek-ai/dsh-session-query-sqlite，由本插件接管
# ctx.sessionQuery。停掉的原因有两条：
#   1. 官方用 unicode61 分词，中文查询 0 命中（连续汉字被当成一个 token）；
#   2. 它要求磁盘快照在读前读后完全一致，对话进行中必然抛
#      SESSION_QUERY_PERSISTENCE_FAILED。
#
# ⚠ 下面两行不能注释掉：官方引擎一旦先注册了 sessionQuery，本插件会因为服务名
#   冲突无法接管，中文搜索就回到 0 命中。仅当本插件自身无法加载、需要紧急恢复
#   会话功能时才注释它们（代价：中文内容搜索不可用，侧栏只搜标题）。
#
# 可调参数（在 profile 的 cordis.patch.yml 里写同 id 条目即可覆盖）：
#   path        索引库路径，默认 <DSH_HOME>/cache/session-search-pro.db
#   openAt      startup | first-search | never（never = 彻底关闭内容检索）
#   defaultLimit / maxLimit / snippetChars
- id: session-query-sqlite
  disabled: true

- insert:
    - id: session-search-pro
      name: 'dsh-session-search-pro'
      config:
        path: !!js dshHomePath('cache/session-search-pro.db')
        openAt: first-search
